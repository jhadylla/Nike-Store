<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <!-- OBRIGATÓRIO: faz o site se adaptar ao celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nike Store</title>

  <!-- 1º: Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 2º: seu CSS (sempre depois do Bootstrap) -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- NAVBAR -->
  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Nike Store</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="index.html#inicio">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#produtos">Produtos</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#contato">Contato</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>

    <!-- HERO -->
    <section id="inicio" class="hero text-center py-5 bg-light">
      <div class="container py-4">
        <h1 class="display-4 fw-bold">A melhor marca que você já viu</h1>
        <p class="lead">A marca que faz você brilhar</p>
      </div>
    </section>

    <!-- PRODUTOS -->
    <section id="produtos" class="py-5">
      <div class="container">
        <h2 class="text-center fw-bold mb-4">Categorias de Produtos</h2>

        <div class="row g-4">

          <!-- 1. Sapatos -->
          <div class="col-12 col-md-6 col-lg-4">
            <article class="card card-produto h-100 shadow-sm border-0">
              <div class="bg-light text-center p-3">
                <img src="img/sapato-branco.avif" class="card-img-top img-fluid rounded" style="height: 250px; object-fit: contain;" alt="Sapatos Nike">
              </div>
              <div class="card-body text-center d-flex flex-column justify-content-between">
                <h3 class="card-title h5 fw-bold mb-3">Sapatos</h3>
                <!-- Aponta para a pasta produtos.html/sapatos.html -->
                <a href="produtos.html/sapatos.html" class="btn btn-dark w-100 fw-semibold rounded-pill py-2">Ver Sapatos</a>
              </div>
            </article>
          </div>

          <!-- 2. Roupas -->
          <div class="col-12 col-md-6 col-lg-4">
            <article class="card card-produto h-100 shadow-sm border-0">
              <div class="bg-light text-center p-3">
                <img src="img/Roupa-nike.jfif" class="card-img-top img-fluid rounded" style="height: 250px; object-fit: contain;" alt="Roupas Nike">
              </div>
              <div class="card-body text-center d-flex flex-column justify-content-between">
                <h3 class="card-title h5 fw-bold mb-3">Roupas</h3>
                <!-- Aponta para a pasta produtos.html/roupas.html (se você criar este arquivo) -->
                <a href="produtos.html/roupas.html" class="btn btn-dark w-100 fw-semibold rounded-pill py-2">Ver Roupas</a>
              </div>
            </article>
          </div>

          <!-- 3. Meias -->
          <div class="col-12 col-md-6 col-lg-4">
            <article class="card card-produto h-100 shadow-sm border-0">
              <div class="bg-light text-center p-3">
                <img src="img/meia-canu-alto.avif" class="card-img-top img-fluid rounded" style="height: 250px; object-fit: contain;" alt="Meias Nike">
              </div>
              <div class="card-body text-center d-flex flex-column justify-content-between">
                <h3 class="card-title h5 fw-bold mb-3">Meias</h3>
                <!-- Aponta para a pasta produtos.html/meia.html -->
                <a href="produtos.html/meia.html" class="btn btn-dark w-100 fw-semibold rounded-pill py-2">Ver Meias</a>
              </div>
            </article>
          </div>

        </div>
      </div>
    </section>

  </main>

  <!-- RODAPÉ -->
  <footer id="contato" class="bg-dark text-center text-white py-4">
    <p class="mb-1">Nike Store</p>
    <p class="mb-0">contato@exemplo.com</p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
