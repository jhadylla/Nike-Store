<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <!-- OBRIGATÓRIO: faz o site se adaptar ao celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nike Store</title>

  <!-- 1º: Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 2º: seu CSS (sempre depois do Bootstrap) -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- NAVBAR -->
  <header>
    <nav class="navbar navbar-expand-md navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#inicio">Nike Store</a>

        <!-- botão hambúrguer (aparece só no celular) -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#inicio">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="#produtos">Produtos</a></li>
            <li class="nav-item"><a class="nav-link" href="#contato">Contato</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>

    <!-- HERO -->
    <section id="inicio" class="hero text-center py-5">
      <div class="container py-4">
        <h1 class="display-4 fw-bold">Os melhores sapatos que você já viu</h1>
        <p class="lead">A marca que faz você brilhar</p>
        <a href="#produtos" class="btn btn-laranja btn-lg rounded-pill px-4">Ver os produtos</a>
      </div>
    </section>

    <!-- PRODUTOS: row + col = grade responsiva (1, 2 e 3 colunas) -->
    <section id="produtos" class="py-5">
      <div class="container">
        <h2 class="text-center fw-bold mb-4">Produtos</h2>

        <div class="row g-4">

          <div class="col-12 col-md-6 col-lg-4">
            <article class="card card-produto h-100 shadow-sm">
              <img src="img/Sapato-Marrom.webp" class="card-img-top img-fluid" alt="Sapato marrom">
              <div class="card-body">
                <h3 class="card-title h5">Sapatos</h3>
                <p class="preco fw-bold">R$ 000,00</p>
                <a href="produtos.html/sapatos.html" class="btn btn-pedir">Pedir</a>
              </div>
            </article>
          </div>

          <div class="col-12 col-md-6 col-lg-4">
            <article class="card card-produto h-100 shadow-sm">
              <img src="img/Roupa-nike.jfif" class="card-img-top img-fluid" alt="Roupa Nike">
              <div class="card-body">
                <h3 class="card-title h5">Roupas</h3>
                <p class="preco fw-bold">R$ 000,00</p>
                <a href="#" class="btn btn-pedir">Pedir</a>
              </div>
            </article>
          </div>

          <div class="col-12 col-md-6 col-lg-4">
            <article class="card card-produto h-100 shadow-sm">
              <img src="img/Bone.jfif" class="card-img-top img-fluid" alt="Boné">
              <div class="card-body">
                <h3 class="card-title h5">Bonés</h3>
                <p class="preco fw-bold">R$ 000,00</p>
                <a href="#" class="btn btn-pedir">Pedir</a>
              </div>
            </article>
          </div>

        </div>
      </div>
    </section>

  </main>

  <!-- RODAPÉ -->
  <footer id="contato" class="text-center text-white py-4">
    <p class="mb-1">Nike Store</p>
    <p class="mb-0">contato@exemplo.com</p>
  </footer>

  <!-- Scripts no final do body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
