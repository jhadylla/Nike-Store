<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Produtos - Nike Style</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container py-4">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
      
      <!-- Produto 1 -->
      <div class="col">
        <div class="card product-card h-100 border-0">
          <div class="position-relative bg-light rounded product-img-wrapper">
            <img src="img/sapado-verde.avif" class="card-img-top product-img p-3" alt="Tênis Nike Air Max Excee Masculino">
          </div>
          <div class="card-body px-0 pt-2 pb-0">
            <h3 class="product-title fs-6 fw-bold mb-0 text-truncate">Tênis Nike Air Max Excee Masculino</h3>
            <p class="product-category text-secondary small mb-2">Casual</p>
            <div class="d-flex align-items-center gap-1 mb-2">
              <span class="product-price-current fw-bold">R$ 459,99 no Pix</span>
              <span class="product-price-old text-decoration-line-through text-secondary extra-small">R$ 799,99</span>
              <span class="product-discount text-success fw-bold extra-small">43% off</span>
            </div>
            <div class="d-flex align-items-center gap-1 extra-small">
              <div class="rating-stars text-dark">
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-half"></i>
                <i class="bi bi-star"></i>
              </div>
              <span class="badge border text-dark fw-normal rating-badge ms-1">3.9</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Produto 2 -->
      <div class="col">

          </div>
          <div class="card-body px-0 pt-2 pb-0">
            <h3 class="product-title fs-6 fw-bold mb-0 text-truncate">Tênis Nike Gamma Force Feminino</h3>
            <p class="product-category text-secondary small mb-2">Casual</p>
            <div class="d-flex align-items-center gap-1 mb-2">
              <span class="product-price-current fw-bold">R$ 349,99 no Pix</span>
              <span class="product-price-old text-decoration-line-through text-secondary extra-small">R$ 749,99</span>
              <span class="product-discount text-success fw-bold extra-small">53% off</span>
            </div>
            <div class="d-flex align-items-center gap-1 extra-small">
              <div class="rating-stars text-dark">
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-half"></i>
              </div>
              <span class="badge border text-dark fw-normal rating-badge ms-1">4.6</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Produto 3 -->
      <div class="col">
        <div class="card product-card h-100 border-0">

          </div>
          <div class="card-body px-0 pt-2 pb-0">

              <span class="product-discount text-success fw-bold extra-small">42% off</span>
            </div>
            <div class="d-flex align-items-center gap-1 extra-small">
              <div class="rating-stars text-dark">
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-half"></i>
              </div>
              <span class="badge border text-dark fw-normal rating-badge ms-1">4.7</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Produto 4 -->
      <div class="col">
        <div class="card product-card h-100 border-0">
          <div class="position-relative bg-light rounded product-img-wrapper">

              <i class="bi bi-heart"></i>
            </button>
